<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded dark background tile matching warm graphite theme -->
  <rect width="32" height="32" rx="8" fill="#171614" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="#302d27" stroke-opacity="0.8" />
  
  <!-- Subtle upward gradient glow under the trend line -->
  <path d="M6 23 L13 16 L18 20 L26 10 L26 23 Z" fill="url(#trendGlow)" opacity="0.25" />
  
  <!-- Sleek TrendingUp line matching the Navbar brand icon -->
  <path d="M6 22 L13 15 L18 19 L26 9" stroke="#d6a85f" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M19.5 9 H26 V15.5" stroke="#d6a85f" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing peak accent dot -->
  <circle cx="26" cy="9" r="2" fill="#d6a85f" />
  
  <defs>
    <linearGradient id="trendGlow" x1="16" y1="9" x2="16" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d6a85f" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d6a85f" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>