name: Store Structure Watchdog Canary

on:
  schedule:
    # Run once daily at 00:00 UTC to guard against unattended mock store changes
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  canary-check:
    name: Store Structure Canary Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Execute Store Structure Canary
        run: npm run test:structure
        env:
          STORE_BASE_URL: https://demo.inelabteamdev.com
